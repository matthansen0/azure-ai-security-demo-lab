name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/it-admin/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r agents/it-admin/requirements.txt \
            pytest pytest-asyncio httpx

      - name: Run agent tests
        run: python -m pytest agents/it-admin/tests -q

      - name: Check shell syntax
        run: bash -n scripts/*.sh scripts/tests/*.sh

      - name: Check Python script syntax
        run: python -m py_compile scripts/prepdocs-search-only.py .github/scripts/lab_rot_watch.py

      - name: Test lab-rot scanner
        run: python .github/scripts/test_lab_rot_watch.py

      - name: Test deployment preflight
        run: bash scripts/tests/preflight-check.test.sh

      - name: Compile Bicep
        run: |
          az bicep install --version v0.46.1
          set +e
          az bicep build --file infra/main.bicep \
            --outfile "$RUNNER_TEMP/main.json" \
            2>"$RUNNER_TEMP/bicep.log"
          BICEP_EXIT=$?
          set -e
          # Drop the CLI's own "new release available" self-update notice; it is
          # unrelated to template correctness and would otherwise cause this
          # warning-free check to fail whenever a newer Bicep CLI ships.
          grep -v "A new Bicep release is available" "$RUNNER_TEMP/bicep.log" \
            > "$RUNNER_TEMP/bicep.filtered.log" || true
          cat "$RUNNER_TEMP/bicep.filtered.log"
          test "$BICEP_EXIT" -eq 0
          test ! -s "$RUNNER_TEMP/bicep.filtered.log"