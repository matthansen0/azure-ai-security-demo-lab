# Azure Developer CLI (azd) configuration
# Run 'azd up' to provision infrastructure and deploy the application

name: azure-ai-security-sandbox
metadata:
  template: azure-ai-security-sandbox@0.1.0

# Infrastructure configuration
infra:
  provider: bicep
  path: infra
  module: main

# Services - backend is built and deployed to Container Apps
services:
  backend:
    project: ./app/backend
    language: py
    host: containerapp
    docker:
      remoteBuild: true
  
  # IT Admin Agent API
  agent:
    project: ./agents/it-admin
    language: py
    host: containerapp
    docker:
      remoteBuild: true

# Hooks for custom deployment logic
hooks:
  # Pre-provision: Run capacity preflight + tests before deploying
  preprovision:
    shell: sh
    run: |
      # Recover only exact soft-deleted resources from this azd environment.
      if [ -x ./scripts/recover-soft-deleted.sh ]; then
        ./scripts/recover-soft-deleted.sh || exit 1
      fi

      # Regional capacity / quota preflight (skippable via SKIP_PREFLIGHT=true)
      if [ "${SKIP_PREFLIGHT:-false}" != "true" ]; then
        if [ -x ./scripts/preflight-check.sh ]; then
          ./scripts/preflight-check.sh || exit 1
        fi
      else
        echo "⚠️  Skipping preflight capacity check (SKIP_PREFLIGHT=true)."
      fi

      echo "Running pre-deployment tests..."
      
      # Run IT Admin Agent tests if they exist
      if [ -d "./agents/it-admin/tests" ]; then
        echo "Running IT Admin Agent tests..."
        
        # Create/use venv for tests
        if [ ! -d "./.venv-tests" ]; then
          python3 -m venv .venv-tests
        fi
        
        # Install test dependencies
        ./.venv-tests/bin/pip install -q pytest pytest-asyncio httpx
        ./.venv-tests/bin/pip install -q -r ./agents/it-admin/requirements.txt
        
        # Run tests
        cd ./agents/it-admin
        ../../.venv-tests/bin/python -m pytest tests/ -v --tb=short
        TEST_EXIT_CODE=$?
        cd ../..
        
        if [ $TEST_EXIT_CODE -ne 0 ]; then
          echo "❌ Tests failed! Aborting deployment."
          exit 1
        fi
        echo "✅ All tests passed."
      else
        echo "No agent tests found, skipping..."
      fi

  # Post-provision: Configure Front Door routes (only if AFD is enabled)
  postprovision:
    shell: sh
    run: |
      echo "Ensuring Front Door endpoint and route are enabled..."
      az afd endpoint update \
        --resource-group $RESOURCE_GROUP_NAME \
        --profile-name $FRONTDOOR_PROFILE_NAME \
        --name $FRONTDOOR_ENDPOINT_NAME \
        --enabled-state Enabled \
        --output none 2>/dev/null || true

      az afd route update \
        --resource-group $RESOURCE_GROUP_NAME \
        --profile-name $FRONTDOOR_PROFILE_NAME \
        --endpoint-name $FRONTDOOR_ENDPOINT_NAME \
        --name default-route \
        --origin-group containerapp-origin-group \
        --patterns-to-match "/*" \
        --forwarding-protocol HttpsOnly \
        --https-redirect Enabled \
        --supported-protocols Http Https \
        --enabled-state Enabled \
        --output none 2>/dev/null || true
      
      # Run prepdocs from upstream submodule to populate search index
      echo "Running prepdocs to populate search index..."
      
      # Auto-initialize submodule if not present
      if [ ! -f "./upstream/app/backend/prepdocs.py" ]; then
        echo "Initializing upstream submodule..."
        git submodule update --init --recursive
      fi
      
      if [ -d "./upstream" ]; then
        # Set up Python virtual environment if not exists
        if [ ! -d "./.venv" ]; then
          echo "Creating Python virtual environment..."
          python3 -m venv .venv
        fi
        
        # Install prepdocs dependencies
        echo "Installing prepdocs dependencies..."
        ./.venv/bin/pip install -q -r ./upstream/app/backend/requirements.txt
        
        # Set environment variables required by prepdocs
        # Map our Bicep output names to what prepdocs expects
        export OPENAI_HOST="azure"
        export AZURE_OPENAI_EMB_DEPLOYMENT="$AZURE_OPENAI_EMBEDDING_DEPLOYMENT"
        export AZURE_SEARCH_INDEX="documents"
        export AZURE_STORAGE_CONTAINER="documents"
        export AZURE_STORAGE_RESOURCE_GROUP="$RESOURCE_GROUP_NAME"
        export AZURE_OPENAI_EMB_MODEL_NAME="text-embedding-3-small"
        export AZURE_OPENAI_EMB_DIMENSIONS="1536"

        # Stage input outside the read-only upstream submodule. Its checksum
        # files are repository state, not proof that this index is populated.
        PREPDOCS_DATA_DIR=$(mktemp -d)
        trap 'rm -rf "$PREPDOCS_DATA_DIR"' EXIT
        cp -R ./upstream/data/. "$PREPDOCS_DATA_DIR/"

        SEARCH_COUNT=$(az rest --method get \
          --uri "https://${AZURE_SEARCH_SERVICE}.search.windows.net/indexes/documents/docs/\$count?api-version=2024-07-01" \
          --resource https://search.azure.com \
          --query @ -o tsv 2>/dev/null || echo 0)
        if [ "${SEARCH_COUNT:-0}" -eq 0 ] 2>/dev/null; then
          echo "Search index is empty; forcing a complete document ingestion..."
          find "$PREPDOCS_DATA_DIR" -type f -name '*.md5' -delete
        fi

        PREPDOCS_SCRIPT="./upstream/app/backend/prepdocs.py"
        STORAGE_PUBLIC_ACCESS=$(az storage account show \
          --resource-group "$RESOURCE_GROUP_NAME" \
          --name "$AZURE_STORAGE_ACCOUNT" \
          --query publicNetworkAccess -o tsv 2>/dev/null || echo Disabled)
        if [ "$STORAGE_PUBLIC_ACCESS" != "Enabled" ]; then
          echo "Storage public access is disabled; indexing without blob page uploads."
          PREPDOCS_SCRIPT="./scripts/prepdocs-search-only.py"
        fi
        
        # Run prepdocs with upstream data (local strategy, not integrated vectorizer)
        echo "Indexing documents..."
        ./.venv/bin/python "$PREPDOCS_SCRIPT" "$PREPDOCS_DATA_DIR/*" --verbose
      else
        echo "Warning: upstream submodule not found. Run 'git submodule update --init'"
      fi

  # Post-down: Purge soft-deleted resources to allow clean redeployment
  postdown:
    shell: sh
    run: |
      echo "Purging soft-deleted resources..."
      
      # Get subscription ID
      SUBSCRIPTION_ID=$(az account show --query id -o tsv)

      # IMPORTANT: Purge ONLY resources associated with this azd environment.
      # Older versions of this hook purged *all* soft-deleted OpenAI/APIM resources
      # in the subscription, which is risky in shared subscriptions.
      EXPECTED_OPENAI_NAME="${AZURE_OPENAI_SERVICE:-}"
      EXPECTED_FOUNDRY_NAME="${AI_FOUNDRY_ACCOUNT_NAME:-}"
      EXPECTED_APIM_NAME="${APIM_SERVICE_NAME:-}"
      EXPECTED_RESOURCE_GROUP="${RESOURCE_GROUP_NAME:-}"
      if [ -z "$EXPECTED_RESOURCE_GROUP" ] && [ -n "${AZURE_ENV_NAME:-}" ]; then
        EXPECTED_RESOURCE_GROUP="rg-${AZURE_ENV_NAME}"
      fi
      if [ -z "$EXPECTED_OPENAI_NAME" ] && [ -z "$EXPECTED_FOUNDRY_NAME" ] && [ -z "$EXPECTED_APIM_NAME" ]; then
        echo "No environment-scoped resource names found."
        echo "Skipping purge to avoid subscription-wide deletion."
        exit 0
      fi
      
      # Purge soft-deleted Cognitive Services (Azure OpenAI)
      echo "Checking for soft-deleted Cognitive Services..."
      DELETED_COG=$(az cognitiveservices account list-deleted --subscription "$SUBSCRIPTION_ID" -o json 2>/dev/null)
      if [ -n "$DELETED_COG" ] && [ "$DELETED_COG" != "[]" ]; then
        for EXPECTED_COG_NAME in "$EXPECTED_OPENAI_NAME" "$EXPECTED_FOUNDRY_NAME"; do
          if [ -n "$EXPECTED_COG_NAME" ]; then
            MATCHING_COG=$(echo "$DELETED_COG" | jq -r --arg name "$EXPECTED_COG_NAME" '.[] | select(.name == $name) | "\(.name) \(.location)"')
            if [ -n "$MATCHING_COG" ]; then
              echo "$MATCHING_COG" | while read -r NAME LOCATION; do
                if [ -n "$NAME" ]; then
                  echo "Purging Cognitive Services: $NAME in $LOCATION"
                  az cognitiveservices account purge \
                    --name "$NAME" \
                    --resource-group "$EXPECTED_RESOURCE_GROUP" \
                    --location "$LOCATION" \
                    --subscription "$SUBSCRIPTION_ID" \
                    --output none 2>/dev/null || true
                fi
              done
            else
              echo "No soft-deleted Cognitive Services found for: $EXPECTED_COG_NAME"
            fi
          fi
        done
      else
        echo "No soft-deleted Cognitive Services found."
      fi

      # Purge the exact Azure ML workspace used by the Foundry account. Foundry
      # workspace soft-delete is separate from Cognitive Services soft-delete.
      if [ -n "$EXPECTED_FOUNDRY_NAME" ] && [ -n "$EXPECTED_RESOURCE_GROUP" ]; then
        AML_WORKSPACE_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${EXPECTED_RESOURCE_GROUP}/providers/Microsoft.MachineLearningServices/workspaces/${EXPECTED_FOUNDRY_NAME}"
        echo "Purging Foundry workspace if soft-deleted: $EXPECTED_FOUNDRY_NAME"
        az rest --method delete \
          --uri "https://management.azure.com${AML_WORKSPACE_ID}?api-version=2024-04-01&forceToPurge=true" \
          --output none 2>/dev/null || true
      fi
      
      # Purge soft-deleted API Management services
      echo "Checking for soft-deleted API Management services..."
      DELETED_APIM=$(az apim deletedservice list --subscription "$SUBSCRIPTION_ID" -o json 2>/dev/null)
      if [ -n "$DELETED_APIM" ] && [ "$DELETED_APIM" != "[]" ]; then
        if [ -n "$EXPECTED_APIM_NAME" ]; then
          MATCHING_APIM=$(echo "$DELETED_APIM" | jq -r --arg name "$EXPECTED_APIM_NAME" '.[] | select(.name == $name) | "\(.name) \(.location)"')
          if [ -n "$MATCHING_APIM" ]; then
            echo "$MATCHING_APIM" | while read -r NAME LOCATION; do
              if [ -n "$NAME" ]; then
                echo "Purging API Management: $NAME in $LOCATION"
                az apim deletedservice purge --service-name "$NAME" --location "$LOCATION" --subscription "$SUBSCRIPTION_ID" 2>/dev/null || true
              fi
            done
          else
            echo "No soft-deleted API Management services found for: $EXPECTED_APIM_NAME"
          fi
        else
          echo "APIM_SERVICE_NAME not set. Skipping API Management purge."
        fi
      else
        echo "No soft-deleted API Management services found."
      fi
      
      echo "Purge complete."

